services:
  postgres:
    image: postgres:15-alpine
    container_name: dip-ai-postgres
    environment:
      POSTGRES_DB: dipdb
      POSTGRES_USER: dipuser
      POSTGRES_PASSWORD: dippassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - dip-ai-network

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: dip-ai-backend
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://dipuser:dippassword@postgres:5432/dipdb
      - ENVIRONMENT=production
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - dip-ai-network
    command: sh -c "python app/db/init_db.py && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

  nginx:
    image: nginx:alpine
    container_name: dip-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl/certs
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dip-ai-network

volumes:
  postgres_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  dip-ai-network:
    driver: bridge